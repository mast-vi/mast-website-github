<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Archivio manuali | MAST</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#071b2f;color:#eef5fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#071b2f,#102d43)}
main{max-width:960px;margin:auto;padding:64px 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #365064;padding-bottom:24px;margin-bottom:45px}
.logo{font-size:30px;letter-spacing:.14em;font-weight:800}.tag{color:#89b2c6;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px}p{color:#a7c1d0;margin:0 0 35px}
nav{display:flex;gap:10px;align-items:center;margin:0 0 22px;flex-wrap:wrap;color:#9bb9cb}
nav button{border:0;background:transparent;color:#9bc7e2;cursor:pointer;font:inherit;padding:5px 0}
ul{padding:0;margin:0;list-style:none;border:1px solid #38536a;border-radius:14px;overflow:hidden}
li+li{border-top:1px solid #2b465c}
li a{display:flex;align-items:center;gap:16px;padding:20px;color:#edf5fa;text-decoration:none;overflow-wrap:anywhere}
li a:hover,li a:focus{background:#173d56}.icon{font-size:22px;flex-shrink:0}.filename{flex:1}.type{font-size:12px;color:#a4bece}
#status{padding:20px;color:#b6cedb} .hidden{display:none}
</style>
</head>
<body><main><header><div class="logo">MAST</div><div class="tag">Documentazione tecnica</div></header>
<h1>Archivio manuali</h1><p>Seleziona una cartella oppure apri un manuale PDF direttamente nel browser.</p>
<nav id="breadcrumb" aria-label="Percorso"></nav>
<div id="status" role="status">Caricamento documenti…</div><ul id="files" class="hidden"></ul>
</main>
<script>
const owner='mast-vi',repo='mast-website-github',root='upload';
const list=document.getElementById('files'),status=document.getElementById('status'),crumb=document.getElementById('breadcrumb');
let path=root;
function siteUrl(p){return '/'+p.split('/').map(encodeURIComponent).join('/')}
function go(p){path=p;history.pushState({path:p},'',siteUrl(root+'/')+(p===root?'':'?dir='+encodeURIComponent(p.slice(root.length+1))));render()}
function row(item){
 const li=document.createElement('li'),a=document.createElement('a'),icon=document.createElement('span'),name=document.createElement('span'),type=document.createElement('span');
 icon.className='icon';name.className='filename';type.className='type';name.textContent=item.name;
 icon.textContent=item.type==='dir'?'▣':'▤';type.textContent=item.type==='dir'?'Cartella':'PDF';
 a.href=item.type==='dir'?'#':siteUrl(item.path);
 if(item.type==='dir')a.addEventListener('click',e=>{e.preventDefault();go(item.path)});
 a.append(icon,name,type);li.append(a);return li;
}
async function render(){
 list.classList.add('hidden');status.hidden=false;status.textContent='Caricamento documenti…';
 crumb.replaceChildren();
 const home=document.createElement('button');home.textContent='Upload';home.onclick=()=>go(root);crumb.append(home);
 if(path!==root){const span=document.createElement('span');span.textContent=' / '+path.slice(root.length+1).replaceAll('/',' / ');crumb.append(span)}
 try{
  const response=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path+'?ref=main',{headers:{Accept:'application/vnd.github+json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(!Array.isArray(data))throw new Error('Percorso non valido');
  const items=data.filter(x=>x.type==='dir'||(x.type==='file'&&/\.pdf$/i.test(x.name))).sort((a,b)=>(a.type===b.type?a.name.localeCompare(b.name,'it'):(a.type==='dir'?-1:1)));
  list.replaceChildren(...items.map(row));list.classList.remove('hidden');status.hidden=true;
  if(!items.length){status.hidden=false;status.textContent='Nessun manuale PDF presente in questa cartella.'}
 }catch(err){status.textContent='Impossibile caricare i file. Verifica la connessione o riprova più tardi.'}
}
window.addEventListener('popstate',()=>{const dir=new URLSearchParams(location.search).get('dir');path=dir?root+'/'+dir:root;render()});
const dir=new URLSearchParams(location.search).get('dir');if(dir&&!dir.split('/').includes('..'))path=root+'/'+dir;
render();
</script></body></html>
